[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-recruitment-matching-agent"
version = "1.0.0"
description = "Recruitment matching agent using MCP and LangGraph"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.0,<3.0",
  "langgraph>=1.0,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
